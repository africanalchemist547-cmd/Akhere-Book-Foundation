<!DOCTYPE html>
<!--
  ABF Website — Akhere Book Foundation
  Stage 1: Public Website Foundation & Homepage
-->
<html lang="en" style="height: 100%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <title>Akhere Book Foundation — Helping Children Access Books & Learning</title>
    <meta name="description" content="Akhere Book Foundation (ABF) puts books in the hands of children who need them most and helps build a future where every child has access to learning, knowledge and opportunity." />
    <meta name="keywords" content="Akhere Book Foundation, ABF, Nigeria, children, books, literacy, education, community library, Azu-Ogbunike, donate books, NGO" />

    <!-- Favicon using official ABF green logo -->
    <link rel="icon" type="image/png" href="/assets/ABF_green_badge_1786625589612.png" />
    <link rel="apple-touch-icon" href="/assets/ABF_green_badge_1786625589612.png" />

    <!-- Canonical URL Placeholder (Replace with final domain after launch) -->
    <link rel="canonical" href="https://[ABF_PRODUCTION_DOMAIN]/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Akhere Book Foundation — Help Build What Comes Next" />
    <meta property="og:description" content="Every child deserves access to books, knowledge and the opportunity to discover what they can become. ABF works to put those tools within reach." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:image" content="https://[ABF_PRODUCTION_DOMAIN]/assets/abf-social-preview.jpg" />
    <meta property="og:url" content="https://[ABF_PRODUCTION_DOMAIN]/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Akhere Book Foundation — Help Build What Comes Next" />
    <meta name="twitter:description" content="Every child deserves access to books, knowledge and the opportunity to discover what they can become." />
    <meta name="twitter:image" content="https://[ABF_PRODUCTION_DOMAIN]/assets/abf-social-preview.jpg" />
    <meta name="twitter:site" content="@AkhereBook" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-blocking font load -->
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap">

# ─── Netlify Build Configuration — Akhere Book Foundation ─────────────────
# Production workflow: GitHub → Netlify → Supabase
# Application root:   artifacts/mockup-sandbox
# Package manager:    pnpm (workspace managed at repo root)
# Build output:       artifacts/mockup-sandbox/dist
# ──────────────────────────────────────────────────────────────────────────

[build]
  base    = "."
  command = "pnpm --filter @workspace/abf-website run build"
  publish = "artifacts/mockup-sandbox/dist"

[build.environment]
  NODE_VERSION = "20"
  # PNPM_FLAGS informs Netlify's automatic dependency installation stage
  # to install and resolve newly added packages (such as @supabase/supabase-js)
  # without failing on the frozen lockfile verification.
  PNPM_FLAGS = "--no-frozen-lockfile"

# ─── SPA Routing Fallback ─────────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
